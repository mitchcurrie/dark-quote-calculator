<!doctype html>
<html lang="en-AU" class="locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DARK Quote Calculator</title>
<meta name="description" content="Quote calculator for DARK Plumbing & Gas. Enter the quote total, labour hours and job costs to see the GP.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1F232A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DARK Quote">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  /* One narrow stack on a charcoal ground: a white form card, then a results card. Copper on the brand and focus. */
  --ground:#1F232A; --ground-ink:#F3F4F2; --ground-muted:#A9B1B9;
  --card:#FFFFFF; --ink:#1F232A; --muted:#5A626A; --line:#C9CECF; --field:#FFFFFF;
  --copper:#C1652F; --copper-soft:#F6E5D8;
  --good:#1F7A47; --warn:#A0620A; --bad:#B3261E;
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#0E1013; --ground-ink:#F3F4F2; --ground-muted:#9AA2AB;
    --card:#1C2026; --ink:#ECEDEB; --muted:#A3ABB4; --line:#3A4048; --field:#15181C;
    --copper:#E08947; --copper-soft:#3A2617;
    --good:#6FCB9A; --warn:#EAB85A; --bad:#F38A80;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1{margin:0;text-align:center;color:var(--ground-ink);font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.1;letter-spacing:.01em}
h1 span{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.card{background:var(--card);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;margin:0}
.incl{margin:0;font-size:13px;color:var(--muted);background:var(--copper-soft);border-radius:4px;padding:8px 10px}
.incl b{color:var(--ink)}
.f{display:flex;flex-direction:column;gap:6px}
.f span{font-weight:700;font-size:14px;color:var(--ink)}
.f small{font-weight:500;color:var(--muted)}
.f input{width:100%;min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--field);color:var(--ink);font:500 18px var(--f-body);font-variant-numeric:tabular-nums}
.f input:focus{outline:none;border-color:var(--copper);box-shadow:0 0 0 3px var(--copper-soft)}
.results{background:var(--card);border-radius:48px;padding:22px 28px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.results h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--good)}
.gp{font-size:16px;color:var(--muted)}
.gp b{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.1;color:var(--good);font-variant-numeric:tabular-nums}
.gp.warn b,.results.warn h2{color:var(--warn)}
.gp.bad b,.results.bad h2{color:var(--bad)}
.sub{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.sub b{color:var(--ink)}
.target{margin-top:8px;padding-top:12px;border-top:1px dashed var(--line);width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:600;color:var(--muted)}
.target b{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1;color:var(--copper);font-variant-numeric:tabular-nums}
.target small{font-size:12px;font-weight:500}
.clear{align-self:center;min-height:42px;padding:0 20px;border:1px solid var(--ground-muted);border-radius:999px;background:transparent;color:var(--ground-ink);font:600 14px var(--f-body);cursor:pointer}
.note{margin:0;text-align:center;font-size:12px;color:var(--ground-muted)}
.actions{display:flex;justify-content:center;gap:10px}

/* lock screen */
.locked .app{display:none}
html:not(.locked) .lock{display:none}
.lock{position:fixed;inset:0;z-index:50;background:var(--ground);display:flex;align-items:center;justify-content:center;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.lock-in{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:18px}
.lock p{margin:0;color:var(--ground-muted);font-size:15px}
.dots{display:flex;gap:16px;min-height:18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ground-muted);transition:background .1s,border-color .1s}
.dots i.on{background:var(--copper);border-color:var(--copper)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.err{min-height:20px;color:#FF9A90;font-size:14px;font-weight:600;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.pad button{width:72px;height:72px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--ground-ink);font:700 26px var(--f-display);cursor:pointer;-webkit-user-select:none;user-select:none}
.pad button:active{background:var(--copper);border-color:var(--copper)}
.pad .blank{visibility:hidden}
.pad .del{border-color:transparent;background:transparent;font:600 15px var(--f-body)}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
</style>
</head>
<body>
<div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lock-title">
  <div class="lock-in">
    <h1 id="lock-title"><span>DARK Plumbing &amp; Gas</span>Quote Calculator</h1>
    <p>Enter the code to open</p>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="err" id="err" role="alert"></div>
    <div class="pad" id="pad">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <button type="button" class="blank" tabindex="-1" aria-hidden="true"></button><button type="button" data-k="0">0</button><button type="button" class="del" data-k="del" aria-label="Delete last digit">Delete</button>
    </div>
  </div>
</div>

<main class="app">
  <h1><span>DARK Plumbing &amp; Gas</span>Quote Calculator</h1>

  <form class="card" id="form" autocomplete="off">
    <p class="incl">Type all prices <b>including GST</b>.</p>
    <label class="f"><span>Quote Total <small>(inc GST)</small></span><input id="quote" inputmode="decimal" enterkeyhint="next"></label>
    <label class="f"><span>Labour Hours</span><input id="hours" inputmode="decimal" enterkeyhint="next"></label>
    <label class="f"><span>Plant Hire and Subbie Cost</span><input id="plant" inputmode="decimal" enterkeyhint="next"></label>
    <label class="f"><span>External Skilled Trade Subbie Cost <small>(Plumber / Electrician / Roofer etc.)</small></span><input id="trade" inputmode="decimal" enterkeyhint="next"></label>
    <label class="f"><span>Material Cost</span><input id="material" inputmode="decimal" enterkeyhint="next"></label>
    <label class="f"><span>QBCC Form 4, Home Insurance, Documentation</span><input id="docs" inputmode="decimal" enterkeyhint="done"></label>
  </form>

  <section class="results" id="results" aria-live="polite">
    <h2>Results:</h2>
    <div class="gp" id="gp-wrap">GP %: <b id="gp-pct">0.00%</b></div>
    <div class="sub">GP <b id="gp">$0.00</b> · Job cost <b id="cost">$0.00</b> <small>(ex GST)</small></div>
    <div class="target"><span id="target-lbl">Quote price to hit 40% GP</span><b id="target">$0.00</b><small id="target-sub">Type hours and costs to see it</small></div>
  </section>

  <div class="actions"><button type="button" class="clear" id="clear">Clear</button><button type="button" class="clear" id="lockbtn">Lock</button></div>
  <p class="note" id="note"></p>
</main>

<script>
(function(){
'use strict';

/* ===== YOUR NUMBERS: change these, save, and upload the file again ===== */
const BREAK_EVEN = 115; // cost per labour hour (set by Mitch, 13 Nov 2026)
const GOAL_PCT   = 30;     // GP % goal: green at or above, amber below, red if losing money
const TARGET_PCT = 40;     // shows the quote price (inc GST) needed to hit this GP %
const GST_PCT    = 10;     // GST rate

// Lock code. This is the SHA-256 of the code, not the code itself.
// To change it, on a Mac run:  printf '1234' | shasum -a 256   (use your new code), and paste the long result here.
const CODE_SHA256 = 'e44396c4365bbfe1afe1a44c76d46775ab7f433e43a77ad556003d5a7d7bd1d0';
const CODE_LENGTH = 4;
/* ======================================================================== */

const GST = GST_PCT / 100, GOAL = GOAL_PCT / 100, TARGET = TARGET_PCT / 100;
const ids = ['quote', 'hours', 'plant', 'trade', 'material', 'docs'];
const $ = id => document.getElementById(id);
const num = v => { const n = parseFloat(String(v || '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
const AUD = new Intl.NumberFormat('en-AU', {style: 'currency', currency: 'AUD'});

// Everything is typed inc GST, so GST comes off the quote and off each cost. Labour has no GST.
// The result matches what you keep after paying the ATO the net GST on your BAS.
function calc(v){
  const quoteEx = num(v.quote) / (1 + GST);
  const costsInc = num(v.plant) + num(v.trade) + num(v.material) + num(v.docs);
  const cost = num(v.hours) * BREAK_EVEN + costsInc / (1 + GST);
  const gp = quoteEx - cost;
  const targetInc = cost / (1 - TARGET) * (1 + GST);   // quote needed for TARGET_PCT GP
  return {quoteEx, cost, gp, pct: quoteEx > 0 ? gp / quoteEx : 0, targetInc};
}
function read(){ const v = {}; ids.forEach(k => { v[k] = $(k).value; }); return v; }
function update(){
  const v = read();
  const r = calc(v);
  const state = r.quoteEx <= 0 ? '' : r.pct >= GOAL - 0.00005 ? '' : r.gp > 0 ? 'warn' : 'bad';
  $('gp-pct').textContent = (r.pct * 100).toFixed(2) + '%';
  $('gp').textContent = AUD.format(r.gp);
  $('cost').textContent = AUD.format(r.cost);
  $('target').textContent = AUD.format(r.targetInc);
  $('target-sub').textContent = r.cost > 0 ? 'inc GST' : 'Type hours and costs to see it';
  $('gp-wrap').className = 'gp ' + state;
  $('results').className = 'results ' + state;
  try { localStorage.setItem('dark-quote-calc', JSON.stringify(v)); } catch (e) {}
}

/* ---------- lock screen ---------- */
const root = document.documentElement;
const dots = $('dots'), err = $('err');
let entry = '', fails = 0, waitUntil = 0;
for (let i = 0; i < CODE_LENGTH; i++) dots.appendChild(document.createElement('i'));
function drawDots(){ Array.from(dots.children).forEach((d, i) => d.classList.toggle('on', i < entry.length)); }
async function sha256(t){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}
function isUnlocked(){ try { return sessionStorage.getItem('dqc-unlocked') === CODE_SHA256; } catch (e) { return false; } }
function openApp(){ root.classList.remove('locked'); }
function lockApp(){
  try { sessionStorage.removeItem('dqc-unlocked'); } catch (e) {}
  entry = ''; drawDots(); err.textContent = '';
  root.classList.add('locked');
  window.scrollTo(0, 0);
}
async function press(k){
  if (Date.now() < waitUntil) return;
  if (k === 'del'){ entry = entry.slice(0, -1); drawDots(); return; }
  if (entry.length >= CODE_LENGTH) return;
  entry += k; drawDots(); err.textContent = '';
  if (entry.length < CODE_LENGTH) return;
  let ok = false;
  try { ok = (await sha256(entry)) === CODE_SHA256; }
  catch (e) { err.textContent = "This browser can't check the code. Open the link in Safari or Chrome."; entry = ''; drawDots(); return; }
  if (ok){
    try { sessionStorage.setItem('dqc-unlocked', CODE_SHA256); } catch (e) {}
    entry = ''; drawDots(); openApp();
    return;
  }
  fails++; entry = '';
  dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
  setTimeout(drawDots, 300);
  if (fails >= 5){
    fails = 0; waitUntil = Date.now() + 30000;
    err.textContent = 'Too many tries. Wait 30 seconds.';
    setTimeout(() => { err.textContent = ''; }, 30000);
  } else {
    err.textContent = 'Wrong code';
  }
}
$('pad').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) press(b.dataset.k); });
document.addEventListener('keydown', e => {
  if (!root.classList.contains('locked')) return;
  if (/^[0-9]$/.test(e.key)){ e.preventDefault(); press(e.key); }
  else if (e.key === 'Backspace'){ e.preventDefault(); press('del'); }
});
$('lockbtn').addEventListener('click', lockApp);
if (isUnlocked()) openApp();

$('target-lbl').textContent = 'Quote price to hit ' + TARGET_PCT + '% GP';
$('note').textContent = 'GP is worked out with the GST taken off. Labour costed at ' + AUD.format(BREAK_EVEN) + '/hr break-even. Goal ' + GOAL_PCT + '% GP or better.';

let saved = null;
try { saved = JSON.parse(localStorage.getItem('dark-quote-calc') || 'null'); } catch (e) {}
if (saved) ids.forEach(k => { if (saved[k] != null) $(k).value = saved[k]; });
update();

$('form').addEventListener('input', update);
$('form').addEventListener('submit', e => e.preventDefault());
$('clear').addEventListener('click', () => { ids.forEach(k => { $(k).value = ''; }); update(); $('quote').focus(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  e.preventDefault();
  const i = ids.indexOf(e.target.id);
  if (i >= 0 && i < ids.length - 1) $(ids[i + 1]).focus(); else e.target.blur();
});
})();
</script>
</body>
</html>
